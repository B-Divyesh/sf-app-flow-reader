<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#132031" />
    <title>App Flow Reader</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to flow</a>
    <header class="topbar">
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div><strong>App Flow Reader</strong><small>Local recorder</small></div>
      <span id="status-chip" class="status-chip">Stopped</span>
    </header>
    <main id="main">
      <h1 class="sr-only">Record and export an app flow</h1>
      <section id="empty" class="empty" aria-labelledby="empty-title">
        <p class="eyebrow">New flow</p>
        <h2 id="empty-title">Record this app path</h2>
        <p>Start here, then click through the task. Each step stays in this browser.</p>
        <button id="start" class="primary" type="button">Start recording</button>
      </section>
      <section id="flow" class="flow" hidden aria-labelledby="flow-title">
        <div class="flow-heading">
          <div><p class="eyebrow">Current flow</p><h2 id="flow-title">Recorded steps</h2></div>
          <button id="toggle" class="record-button" type="button">Resume</button>
        </div>
        <ol id="step-list" class="step-list"></ol>
        <p id="no-steps" class="muted">Your clicks will appear here.</p>
        <div class="actions" aria-label="Flow actions">
          <button id="export-md" type="button">Export Markdown</button>
          <button id="export-json" type="button">Export JSON</button>
          <button id="clear" class="quiet danger" type="button">Clear flow</button>
        </div>
      </section>
      <p id="announcement" class="sr-only" aria-live="polite"></p>
    </main>
    <footer><span>No account</span><span aria-hidden="true">•</span><a href="https://app-flow-reader.sociobot.in/privacy" target="_blank" rel="noreferrer">Privacy</a></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
